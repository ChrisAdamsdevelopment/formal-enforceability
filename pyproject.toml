[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-enforceability"
version = "0.1.0"
description = "A transparent exact-rational reference oracle for finite probabilistic reach-avoid games"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "scipy>=1.11"]

[project.scripts]
validate-independent-oracle = "enforceability.validation_report:main"
verify-identifiability = "enforceability.identifiability:main"
verify-prior-art-review = "enforceability.prior_art_review:main"
verify-stage6a-pilot = "enforceability.stage6_pilot:main"
stage6a-model-pilot = "enforceability.model_pilot:main"
verify-stage6a-model-pilot = "enforceability.model_pilot:verify_main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
