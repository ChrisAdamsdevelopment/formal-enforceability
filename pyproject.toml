[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-enforceability"
version = "0.1.0"
description = "A transparent Stage-1 reference oracle for deterministic sure-safety games"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
